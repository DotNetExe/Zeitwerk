services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ZEITWERK_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=zeitwerk;Username=zeitwerk;Password=${POSTGRES_PASSWORD:-zeitwerk}"
      Zeitwerk__TimeZone: ${ZEITWERK_TIMEZONE:-Europe/Berlin}
      Zeitwerk__ToleranceSeconds: ${ZEITWERK_TOLERANCE_SECONDS:-60}

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeitwerk
      POSTGRES_USER: zeitwerk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeitwerk}
    volumes:
      - zeitwerk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeitwerk -d zeitwerk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: zeitwerk
      PGUSER: zeitwerk
      PGPASSWORD: ${POSTGRES_PASSWORD:-zeitwerk}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  zeitwerk-db:
